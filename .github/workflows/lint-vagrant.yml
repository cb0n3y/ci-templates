name: Lint Vagrant

on:
  workflow_call:
    inputs:
      fail-on-error:
        required: false
        type: boolean
        default: true

jobs:
  lint-vagrant:
    name: Lint Vagrantfile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Vagrant
        run: |
          echo "Installing Vagrant..."
          wget -O- https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update
          sudo apt-get install -y vagrant

      - name: Validate Vagrantfile
        run: |
          echo "Validating Vagrantfile syntax..."
          
          if [ ! -f Vagrantfile ]; then
            echo "No Vagrantfile found in root directory. Skipping validation."
            exit 0
          fi

          # Validación oficial de Vagrant
          if vagrant validate; then
            echo "Vagrantfile is valid!"
          else
            echo "Vagrantfile validation failed!"
            if [[ "${{ inputs.fail-on-error }}" == "true" ]]; then
              exit 1
            fi
          fi

      - name: Check Vagrantfile with Ruby syntax (extra)
        run: |
          echo "Running additional Ruby syntax check..."
          sudo apt-get install -y ruby-full
          ruby -c Vagrantfile 2>&1 | grep -q "Syntax OK" && echo "Ruby syntax OK" || echo "Ruby syntax check had issues"
