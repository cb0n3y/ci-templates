name: Secret Detection

on:
  workflow_call:
    inputs:
      fail-on-error:
        required: false
        type: boolean
        default: true

jobs:
  secret-scan:
    name: Scan for Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necesario para escanear historial

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          config: ''  # Usa config por defecto (muy bueno)
          # Opcional: ruta a config personalizado
          # config-path: .gitleaks.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        run: |
          echo "Secret detection completed with Gitleaks"