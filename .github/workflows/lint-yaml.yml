name: Lint YAML

on:
  workflow_call:
    inputs:
      fail-on-error:
        description: Whether to fail the workflow on linting errors
        required: false
        default: true
        type: boolean
      yamllint-version:
        description: Version of yamllint to use
        required: false
        default: "1.33.0"
        type: string

      runs-on:
        description: The type of runner to use for the job
        required: false
        default: "ubuntu-latest"
        type: string

jobs:
  lint:
    runs-on: ${{ inputs.runs-on }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML files
        run: yamllint -c .yamllint .
